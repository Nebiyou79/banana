name: Backend Tests

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [unit, integration]

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: run-tests
        env:
          CI: true
          JWT_SECRET: ci-test-jwt-secret
          CLOUDINARY_CLOUD_NAME: test-cloud
          CLOUDINARY_API_KEY: test-key
          CLOUDINARY_API_SECRET: test-secret
          MONGODB_MEMORY_SERVER_DOWNLOAD_DIR: /tmp/mongodb-binaries
        run: |
          mkdir -p reports
          npm run test:${{ matrix.project }} -- --ci --json --outputFile=reports/jest-${{ matrix.project }}.json

      - name: Write job summary
        if: always()
        run: node scripts/ci-test-summary.js ${{ matrix.project }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report-${{ matrix.project }}-${{ github.run_id }}
          path: server/reports/jest-${{ matrix.project }}.json
          retention-days: 14

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unit report
        uses: actions/download-artifact@v4
        with:
          name: jest-report-unit-${{ github.run_id }}
          path: reports/unit
        continue-on-error: true

      - name: Download integration report
        uses: actions/download-artifact@v4
        with:
          name: jest-report-integration-${{ github.run_id }}
          path: reports/integration
        continue-on-error: true

      - name: Publish combined summary
        run: node server/scripts/ci-combined-summary.js
